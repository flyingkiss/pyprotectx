[project]
name = "pyprotectx"
version = "0.1.1"
description = "Python code protection & licensing toolkit: Cython compile, NaCl encrypt, Ed25519 license"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "fengxiang", email = "16425494+fengxiang2012@user.noreply.gitee.com" },
]
keywords = [
    "security",
    "protection",
    "obfuscation",
    "cython",
    "licensing",
    "ed25519",
    "encryption",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.0",
    "pynacl>=1.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
compile = ["cython>=3.0", "setuptools>=68"]

[project.scripts]
pyprotect = "pyprotect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyprotect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that compile Cython extensions (require a C compiler)",
]

[tool.uv]
dev-dependencies = [
    "cython>=3.0",
    "setuptools>=68",
    "pytest>=8.0",
]
