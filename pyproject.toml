[project]
name = "pyprotect"
version = "0.1.0"
description = "Python code protection & licensing toolkit: Cython compile, NaCl encrypt, Ed25519 license"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pynacl>=1.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
compile = ["cython>=3.0", "setuptools>=68"]

[project.scripts]
pyprotect = "pyprotect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyprotect"]

[tool.uv]
dev-dependencies = [
    "cython>=3.0",
    "setuptools>=68",
    "pytest>=8.0",
]
