[project]
name = "pyprotectx-protected"
version = "0.1.0"
description = "Runtime support for pyprotectx: encrypted module loader + license verification"
readme = "README.md"
license = "MIT"
authors = [
    { name = "fengxiang", email = "16425494+fengxiang2012@user.noreply.gitee.com" },
]
keywords = [
    "security",
    "runtime",
    "encryption",
    "licensing",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pynacl>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyprotect_protected"]
