[project]
name = "pyprotect-protected"
version = "0.1.0"
description = "Runtime support for pyprotect: encrypted module loader + license verification"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pynacl>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyprotect_protected"]
